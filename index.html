<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Beyblade Battle Tracker</title>
  
  <!-- PWA Manifest & iOS Support -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#03c6fc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Beyblade Tracker">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1046/1046857.png">

  <!-- Tailwind CSS & Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    /* Forced Landscape Logic for Portrait Orientation */
    @media screen and (orientation: portrait) {
      body {
        transform: rotate(-90deg);
        transform-origin: left top;
        width: 100vh;
        height: 100vw;
        position: absolute;
        top: 100%;
        left: 0;
        overflow: hidden;
      }
    }
    @media screen and (orientation: landscape) {
      body {
        width: 100vw;
        height: 100vh;
      }
    }
    
    /* Touch optimization */
    button, input {
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Generous Safe Area Padding for mobile gesture bars & cutouts */
    .safe-padding {
      padding-left: max(2rem, env(safe-area-inset-left));
      padding-right: max(2rem, env(safe-area-inset-right));
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans overflow-hidden select-none">

  <!-- Confetti Canvas overlay -->
  <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full"></canvas>

  <!-- 1. SETUP SCREEN -->
  <div id="setup-screen" class="w-full h-full flex flex-col justify-center items-center safe-padding bg-slate-900 transition-opacity duration-300 overflow-y-auto">
    <div class="max-w-xl w-full bg-slate-800/90 backdrop-blur border border-slate-700 rounded-2xl p-5 shadow-2xl flex flex-col gap-4 my-auto">
      <div class="text-center">
        <h1 class="text-2xl font-black italic tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-[#03c6fc] to-[#42ff94]">
          BEYBLADE COUNTER
        </h1>
        <p class="text-xs text-slate-400 font-semibold tracking-widest mt-0.5">MOBILE MATCH TRACKER</p>
      </div>

      <!-- Settings Grid -->
      <div class="grid grid-cols-2 gap-3">
        <!-- Max Points Stepper -->
        <div class="flex flex-col items-center gap-1 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50">
          <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Points to Win Round</label>
          <div class="flex items-center gap-2">
            <button id="btn-points-minus" type="button" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xl font-bold rounded-xl border border-slate-600 flex items-center justify-center text-slate-200 transition">
              <i class="fa-solid fa-minus"></i>
            </button>
            <input id="max-points-input" type="number" value="4" min="1" max="99" class="w-16 h-12 bg-slate-950 text-center font-black text-2xl text-yellow-400 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-400">
            <button id="btn-points-plus" type="button" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xl font-bold rounded-xl border border-slate-600 flex items-center justify-center text-slate-200 transition">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <!-- Rounds Stepper (Starts from 1) -->
        <div class="flex flex-col items-center gap-1 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/50">
          <label class="text-[11px] font-bold uppercase tracking-wider text-slate-300">Match Rounds</label>
          <div class="flex items-center gap-2">
            <button id="btn-rounds-minus" type="button" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xl font-bold rounded-xl border border-slate-600 flex items-center justify-center text-slate-200 transition">
              <i class="fa-solid fa-minus"></i>
            </button>
            <input id="total-rounds-input" type="number" value="1" min="1" max="99" class="w-16 h-12 bg-slate-950 text-center font-black text-2xl text-yellow-400 rounded-xl border border-slate-700 focus:outline-none focus:border-cyan-400">
            <button id="btn-rounds-plus" type="button" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xl font-bold rounded-xl border border-slate-600 flex items-center justify-center text-slate-200 transition">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Blader Names Setup -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-[#03c6fc] uppercase tracking-wider mb-1">Blader 1</label>
          <input id="blader1-input" type="text" value="Blader 1" class="w-full h-11 bg-slate-950 px-3 font-bold text-slate-100 rounded-lg border border-[#03c6fc]/40 focus:outline-none focus:border-[#03c6fc]">
        </div>
        <div>
          <label class="block text-xs font-bold text-[#42ff94] uppercase tracking-wider mb-1">Blader 2</label>
          <input id="blader2-input" type="text" value="Blader 2" class="w-full h-11 bg-slate-950 px-3 font-bold text-slate-100 rounded-lg border border-[#42ff94]/40 focus:outline-none focus:border-[#42ff94]">
        </div>
      </div>

      <!-- Start Button -->
      <button id="start-btn" type="button" class="w-full py-3 bg-gradient-to-r from-[#03c6fc] to-[#42ff94] text-slate-950 font-black text-lg tracking-wider rounded-xl shadow-lg active:scale-98 transition transform">
        START BATTLE
      </button>
    </div>
  </div>

  <!-- 2. SCORE COUNTER SCREEN -->
  <div id="counter-screen" class="hidden w-full h-full flex safe-padding relative">
    
    <!-- Left Side: Blader 1 (#03c6fc) -->
    <div class="w-1/2 h-full bg-[#03c6fc] text-slate-950 flex flex-col justify-between py-3 pl-6 pr-8 relative border-r-2 border-slate-900/30">
      
      <!-- Top Actions (Blader 1) -->
      <div class="flex items-center gap-2 z-10">
        <button id="b1-add1" class="px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition">
          +1
        </button>
        <button id="b1-add2" class="px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition">
          +2
        </button>
        <button id="b1-add3" class="px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition">
          +3
        </button>
        <button id="b1-undo" class="ml-auto px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition" title="Undo Side 1">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>

      <!-- Score & Name Display (Blader 1) -->
      <div class="flex flex-col items-center justify-center my-auto">
        <h2 id="b1-display-name" class="text-xl font-black tracking-wide uppercase truncate max-w-[90%] text-slate-950/80 mb-1">
          BLADER 1
        </h2>
        <span id="b1-score" class="text-7xl font-black tracking-tight drop-shadow-md">
          0
        </span>
        <!-- Round Wins Indicator Badges -->
        <div id="b1-round-indicators" class="flex gap-1.5 mt-2">
          <!-- Dynamically populated round chips -->
        </div>
      </div>

      <div class="text-[11px] font-bold text-slate-950/60 uppercase tracking-widest text-center">FIRST TO <span class="max-target-display">4</span> PTS</div>
    </div>

    <!-- Center Divider & Refresh Control -->
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex flex-col items-center gap-3 pointer-events-none">
      <div class="w-11 h-11 bg-slate-950 rounded-full border-4 border-slate-800 flex items-center justify-center font-black text-white text-xs shadow-xl tracking-wider">
        VS
      </div>

      <!-- Mid Round Refresh Button -->
      <button id="mid-refresh-btn" class="pointer-events-auto w-10 h-10 bg-slate-900/90 hover:bg-slate-950 text-white active:rotate-180 rounded-full border-2 border-slate-700 flex items-center justify-center shadow-lg transition duration-300" title="Reset Current Round">
        <i class="fa-solid fa-rotate-right text-sm"></i>
      </button>
    </div>

    <!-- Bottom Center: Exit to Setup Button -->
    <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20">
      <button id="bottom-setup-btn" class="px-3.5 py-1.5 bg-slate-950/80 hover:bg-slate-950 text-white active:scale-95 rounded-full border border-slate-700/80 text-xs font-bold flex items-center gap-2 shadow-lg transition backdrop-blur-sm">
        <i class="fa-solid fa-gear text-slate-400"></i>
        <span>SETTINGS</span>
      </button>
    </div>

    <!-- Right Side: Blader 2 (#42ff94) -->
    <div class="w-1/2 h-full bg-[#42ff94] text-slate-950 flex flex-col justify-between py-3 pr-6 pl-8 relative border-l-2 border-slate-900/30">
      
      <!-- Top Actions (Blader 2) -->
      <div class="flex items-center gap-2 z-10 flex-row-reverse">
        <button id="b2-add1" class="px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition">
          +1
        </button>
        <button id="b2-add2" class="px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition">
          +2
        </button>
        <button id="b2-add3" class="px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition">
          +3
        </button>
        <button id="b2-undo" class="mr-auto px-4 py-2 bg-slate-950/20 hover:bg-slate-950/30 active:scale-95 text-slate-950 border border-slate-950/20 rounded-xl font-black text-base shadow-md transition" title="Undo Side 2">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>

      <!-- Score & Name Display (Blader 2) -->
      <div class="flex flex-col items-center justify-center my-auto">
        <h2 id="b2-display-name" class="text-xl font-black tracking-wide uppercase truncate max-w-[90%] text-slate-950/80 mb-1">
          BLADER 2
        </h2>
        <span id="b2-score" class="text-7xl font-black tracking-tight drop-shadow-md">
          0
        </span>
        <!-- Round Wins Indicator Badges -->
        <div id="b2-round-indicators" class="flex gap-1.5 mt-2">
          <!-- Dynamically populated round chips -->
        </div>
      </div>

      <div class="text-[11px] font-bold text-slate-950/60 uppercase tracking-widest text-center">FIRST TO <span class="max-target-display">4</span> PTS</div>
    </div>
  </div>

  <!-- 3. ROUND / MATCH VICTORY CONGRATULATIONS SCREEN -->
  <div id="victory-screen" class="hidden w-full h-full flex flex-col items-center justify-center safe-padding relative text-center">
    <div class="z-10 max-w-md w-full bg-slate-950/60 backdrop-blur-md p-6 rounded-3xl border border-white/20 shadow-2xl flex flex-col items-center gap-3">
      <div class="w-16 h-16 bg-yellow-400 text-slate-950 rounded-full flex items-center justify-center text-3xl shadow-lg mb-1">
        <i id="victory-icon" class="fa-solid fa-trophy"></i>
      </div>
      <h2 id="victory-badge-title" class="text-xs font-bold uppercase tracking-widest text-slate-900/80">ROUND VICTORY</h2>
      <h1 id="winner-name-display" class="text-3xl font-black text-slate-950 tracking-wide uppercase drop-shadow-sm">
        BLADER 1 WINS ROUND!
      </h1>
      <p id="winner-score-summary" class="text-base font-bold text-slate-950/90">
        Rounds Won: 1 - 0
      </p>

      <div class="flex gap-3 w-full mt-3">
        <button id="next-action-btn" class="flex-1 py-3 bg-slate-950 hover:bg-slate-900 text-white font-bold rounded-xl shadow-lg active:scale-95 transition">
          NEXT ROUND
        </button>
        <button id="new-setup-btn" class="flex-1 py-3 bg-white/30 hover:bg-white/40 text-slate-950 border border-slate-950/30 font-bold rounded-xl shadow-md active:scale-95 transition">
          SETTINGS
        </button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Audio synth
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playTone(freq, type, duration) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }

      // App state
      let maxPoints = 4;
      let totalRounds = 1;
      let roundsNeeded = 1;
      let score1 = 0;
      let score2 = 0;
      let roundsWon1 = 0;
      let roundsWon2 = 0;
      let history1 = [];
      let history2 = [];
      let name1 = "Blader 1";
      let name2 = "Blader 2";
      let confettiActive = false;
      let isMatchOver = false;

      // DOM Elements
      const setupScreen = document.getElementById('setup-screen');
      const counterScreen = document.getElementById('counter-screen');
      const victoryScreen = document.getElementById('victory-screen');

      const maxPointsInput = document.getElementById('max-points-input');
      const totalRoundsInput = document.getElementById('total-rounds-input');
      const blader1Input = document.getElementById('blader1-input');
      const blader2Input = document.getElementById('blader2-input');
      const startBtn = document.getElementById('start-btn');

      const b1DisplayName = document.getElementById('b1-display-name');
      const b2DisplayName = document.getElementById('b2-display-name');
      const b1ScoreEl = document.getElementById('b1-score');
      const b2ScoreEl = document.getElementById('b2-score');
      const b1RoundIndicators = document.getElementById('b1-round-indicators');
      const b2RoundIndicators = document.getElementById('b2-round-indicators');
      const maxTargetDisplays = document.querySelectorAll('.max-target-display');
      const midRefreshBtn = document.getElementById('mid-refresh-btn');
      const bottomSetupBtn = document.getElementById('bottom-setup-btn');

      const winnerNameDisplay = document.getElementById('winner-name-display');
      const winnerScoreSummary = document.getElementById('winner-score-summary');
      const victoryBadgeTitle = document.getElementById('victory-badge-title');
      const victoryIcon = document.getElementById('victory-icon');
      const nextActionBtn = document.getElementById('next-action-btn');
      const newSetupBtn = document.getElementById('new-setup-btn');

      // Setup Stepper Listeners
      document.getElementById('btn-points-minus').addEventListener('click', () => {
        let val = parseInt(maxPointsInput.value) || 1;
        if (val > 1) maxPointsInput.value = val - 1;
      });
      document.getElementById('btn-points-plus').addEventListener('click', () => {
        let val = parseInt(maxPointsInput.value) || 1;
        if (val < 99) maxPointsInput.value = val + 1;
      });

      document.getElementById('btn-rounds-minus').addEventListener('click', () => {
        let val = parseInt(totalRoundsInput.value) || 1;
        if (val > 1) totalRoundsInput.value = val - 1;
      });
      document.getElementById('btn-rounds-plus').addEventListener('click', () => {
        let val = parseInt(totalRoundsInput.value) || 1;
        if (val < 99) totalRoundsInput.value = val + 1;
      });

      // Start Game Event
      startBtn.addEventListener('click', () => {
        maxPoints = parseInt(maxPointsInput.value) || 4;
        totalRounds = parseInt(totalRoundsInput.value) || 1;
        roundsNeeded = Math.ceil(totalRounds / 2);

        name1 = blader1Input.value.trim() || "Blader 1";
        name2 = blader2Input.value.trim() || "Blader 2";

        b1DisplayName.textContent = name1;
        b2DisplayName.textContent = name2;
        maxTargetDisplays.forEach(el => el.textContent = maxPoints);

        roundsWon1 = 0;
        roundsWon2 = 0;
        isMatchOver = false;
        resetScores();
        updateRoundIndicators();

        setupScreen.classList.add('hidden');
        counterScreen.classList.remove('hidden');
        victoryScreen.classList.add('hidden');
      });

      // Point Buttons Event Binding
      document.getElementById('b1-add1').addEventListener('click', () => addPoints(1, 1));
      document.getElementById('b1-add2').addEventListener('click', () => addPoints(1, 2));
      document.getElementById('b1-add3').addEventListener('click', () => addPoints(1, 3));
      document.getElementById('b1-undo').addEventListener('click', () => undoSide(1));

      document.getElementById('b2-add1').addEventListener('click', () => addPoints(2, 1));
      document.getElementById('b2-add2').addEventListener('click', () => addPoints(2, 2));
      document.getElementById('b2-add3').addEventListener('click', () => addPoints(2, 3));
      document.getElementById('b2-undo').addEventListener('click', () => undoSide(2));

      midRefreshBtn.addEventListener('click', resetScores);
      bottomSetupBtn.addEventListener('click', goToSetup);

      function addPoints(blader, pts) {
        if (blader === 1) {
          score1 += pts;
          history1.push(pts);
          b1ScoreEl.textContent = score1;
          playTone(440 + pts * 100, 'sine', 0.15);
        } else {
          score2 += pts;
          history2.push(pts);
          b2ScoreEl.textContent = score2;
          playTone(520 + pts * 100, 'sine', 0.15);
        }

        checkRoundVictory();
      }

      function undoSide(blader) {
        if (blader === 1 && history1.length > 0) {
          const popped = history1.pop();
          score1 = Math.max(0, score1 - popped);
          b1ScoreEl.textContent = score1;
          playTone(300, 'triangle', 0.1);
        } else if (blader === 2 && history2.length > 0) {
          const popped = history2.pop();
          score2 = Math.max(0, score2 - popped);
          b2ScoreEl.textContent = score2;
          playTone(300, 'triangle', 0.1);
        }
      }

      function resetScores() {
        score1 = 0;
        score2 = 0;
        history1 = [];
        history2 = [];
        b1ScoreEl.textContent = 0;
        b2ScoreEl.textContent = 0;
      }

      function updateRoundIndicators() {
        let html1 = '';
        for (let i = 1; i <= roundsNeeded; i++) {
          const won = i <= roundsWon1;
          html1 += `<div class="w-6 h-6 rounded-full border-2 border-slate-950/40 flex items-center justify-center text-[10px] font-black ${won ? 'bg-slate-950 text-[#03c6fc]' : 'bg-slate-950/10 text-slate-950/40'}">${i}</div>`;
        }
        b1RoundIndicators.innerHTML = html1;

        let html2 = '';
        for (let i = 1; i <= roundsNeeded; i++) {
          const won = i <= roundsWon2;
          html2 += `<div class="w-6 h-6 rounded-full border-2 border-slate-950/40 flex items-center justify-center text-[10px] font-black ${won ? 'bg-slate-950 text-[#42ff94]' : 'bg-slate-950/10 text-slate-950/40'}">${i}</div>`;
        }
        b2RoundIndicators.innerHTML = html2;
      }

      function checkRoundVictory() {
        if (score1 >= maxPoints || score2 >= maxPoints) {
          const roundWinner = score1 >= maxPoints ? 1 : 2;
          
          if (roundWinner === 1) roundsWon1++;
          else roundsWon2++;

          updateRoundIndicators();

          if (roundsWon1 >= roundsNeeded || roundsWon2 >= roundsNeeded) {
            isMatchOver = true;
            showVictoryScreen(roundWinner, true);
          } else {
            isMatchOver = false;
            showVictoryScreen(roundWinner, false);
          }
        }
      }

      function showVictoryScreen(winnerBlader, isMatch) {
        const isB1 = winnerBlader === 1;
        const winnerName = isB1 ? name1 : name2;
        const winnerBgColor = isB1 ? 'bg-[#03c6fc]' : 'bg-[#42ff94]';

        if (isMatch) {
          victoryIcon.className = "fa-solid fa-trophy";
          victoryBadgeTitle.textContent = `BEST OF ${totalRounds} MATCH VICTORY`;
          winnerNameDisplay.textContent = `${winnerName} WINS THE MATCH!`;
          nextActionBtn.textContent = "PLAY AGAIN";
        } else {
          victoryIcon.className = "fa-solid fa-flag-checkered";
          victoryBadgeTitle.textContent = "ROUND VICTORY";
          winnerNameDisplay.textContent = `${winnerName} WINS ROUND!`;
          nextActionBtn.textContent = "NEXT ROUND";
        }

        winnerScoreSummary.textContent = `Rounds Won: ${roundsWon1} - ${roundsWon2}`;
        victoryScreen.className = `w-full h-full flex flex-col items-center justify-center safe-padding relative text-center ${winnerBgColor} transition-colors duration-500`;

        counterScreen.classList.add('hidden');
        victoryScreen.classList.remove('hidden');

        playTone(587.33, 'triangle', 0.2);
        setTimeout(() => playTone(880, 'sine', 0.4), 200);

        triggerConfetti();
      }

      // Next Action (Next Round or Play Again)
      nextActionBtn.addEventListener('click', () => {
        stopAndClearConfetti();
        if (isMatchOver) {
          roundsWon1 = 0;
          roundsWon2 = 0;
          isMatchOver = false;
        }
        resetScores();
        updateRoundIndicators();
        victoryScreen.classList.add('hidden');
        counterScreen.classList.remove('hidden');
      });

      // Settings/Setup Button
      newSetupBtn.addEventListener('click', goToSetup);

      function goToSetup() {
        stopAndClearConfetti();
        victoryScreen.classList.add('hidden');
        counterScreen.classList.add('hidden');
        setupScreen.classList.remove('hidden');
      }

      // Clear confetti on click
      window.addEventListener('pointerdown', () => {
        if (confettiActive) {
          stopAndClearConfetti();
        }
      });

      function triggerConfetti() {
        stopAndClearConfetti();
        confettiActive = true;
        
        const count = 200;
        const defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
          confetti(Object.assign({}, defaults, opts, {
            particleCount: Math.floor(count * particleRatio)
          }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
      }

      function stopAndClearConfetti() {
        confettiActive = false;
        if (window.confetti && typeof window.confetti.reset === 'function') {
          window.confetti.reset();
        }
        const canvas = document.getElementById('confetti-canvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
    });

    // Service Worker Registration for PWA & Offline Support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
